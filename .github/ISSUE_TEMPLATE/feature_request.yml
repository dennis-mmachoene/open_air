name: "✨ Feature request"
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is it for?
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Gallery, Studio, Showroom, Community, Teams, Billing, System Admin, API, Docs, Other]
    validations: { required: true }
