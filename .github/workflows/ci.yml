name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Lockfile in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify package-lock.json matches package.json
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json \
            || { echo "::error::package-lock.json is out of sync. Run 'npm install' and commit the updated lockfile."; exit 1; }

  quality:
    needs: lockfile
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Integration tests (PGlite)
        run: npm run test:integration

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # migration-drift: added in Phase 1 once Drizzle + Neon are wired up.
