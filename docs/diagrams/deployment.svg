<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset=".3" stop-color="#0ea5e9"/><stop offset=".55" stop-color="#14b8a6"/><stop offset=".8" stop-color="#f59e0b"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a8a29e"/></marker>
  <style>.t{fill:#1c1c1a;font-size:14px;font-weight:600}.m{fill:#8a8a85;font-size:11px}.card{fill:#fff;stroke:#e7e5e4}.edge{stroke:#cfcfca;stroke-width:1.5;fill:none}</style></defs>
  <rect width="960" height="460" rx="16" fill="#fbfbfa"/><rect width="960" height="6" rx="3" fill="url(#brand)"/>
  <text x="32" y="46" fill="#1c1c1a" font-size="22" font-weight="600">Deployment Topology</text>
  <text x="32" y="68" class="m">Push to GitHub → CI gate → Vercel build → managed services</text>

  <rect x="32" y="92" width="200" height="92" rx="12" class="card"/><text x="50" y="124" class="t">GitHub</text><text x="50" y="146" class="m">main / develop</text><text x="50" y="164" class="m">push + PR</text>
  <rect x="264" y="92" width="220" height="92" rx="12" class="card"/><text x="282" y="124" class="t">GitHub Actions (CI)</text><text x="282" y="146" class="m">lockfile · migrations</text><text x="282" y="164" class="m">lint · typecheck · test · build</text>
  <rect x="516" y="92" width="200" height="92" rx="12" class="card"/><text x="534" y="124" class="t">Vercel</text><text x="534" y="146" class="m">build + edge network</text><text x="534" y="164" class="m">ISR · serverless fns</text>
  <rect x="748" y="92" width="180" height="92" rx="12" class="card"/><text x="766" y="124" class="t">Production</text><text x="766" y="146" class="m">openair (HTTPS)</text><text x="766" y="164" class="m">security headers + CSP</text>

  <path class="edge" d="M232 138 H264" marker-end="url(#arr)"/>
  <path class="edge" d="M484 138 H516" marker-end="url(#arr)"/>
  <path class="edge" d="M716 138 H748" marker-end="url(#arr)"/>

  <text x="32" y="232" fill="#57534e" font-size="13" font-weight="700" letter-spacing=".06em">MANAGED SERVICES</text>
  <rect x="32" y="244" width="176" height="80" rx="12" class="card"/><text x="50" y="272" class="t">Neon</text><text x="50" y="294" class="m">Postgres + PITR</text>
  <rect x="224" y="244" width="176" height="80" rx="12" class="card"/><text x="242" y="272" class="t">Stripe</text><text x="242" y="294" class="m">billing + webhooks</text>
  <rect x="416" y="244" width="176" height="80" rx="12" class="card"/><text x="434" y="272" class="t">Upstash</text><text x="434" y="294" class="m">Redis rate limits</text>
  <rect x="608" y="244" width="152" height="80" rx="12" class="card"/><text x="626" y="272" class="t">SMTP</text><text x="626" y="294" class="m">transactional mail</text>
  <rect x="776" y="244" width="152" height="80" rx="12" class="card"/><text x="794" y="272" class="t">PostHog · Sentry</text><text x="794" y="294" class="m">analytics · errors</text>
  <path class="edge" d="M616 184 V244" marker-end="url(#arr)"/>

  <rect x="32" y="356" width="896" height="72" rx="12" fill="#f5f5f4" stroke="#e7e5e4"/>
  <text x="48" y="382" class="t">Fail-closed config</text>
  <text x="48" y="404" class="m">Production requires DATABASE_URL + AUTH_SECRET (validated by lib/env.ts). Recovery target: RPO ≤ 5 min, RTO ≤ 60 min (see docs/RUNBOOK.md).</text>
</svg>
